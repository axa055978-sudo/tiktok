<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اصطادهم 😂</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
    body { background:#1a0a2e; color:#fff; font-family:-apple-system,sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding:16px; }
    h1 { font-size:1.6rem; margin:12px 0 4px; text-align:center; }
    .sub { color:#aaa; font-size:0.85rem; margin-bottom:16px; }
    .hud { display:flex; gap:24px; margin-bottom:18px; }
    .hud-box { background:#2a1a4e; border-radius:12px; padding:8px 20px; text-align:center; }
    .hud-box .label { font-size:0.7rem; color:#888; }
    .hud-box .val { font-size:1.5rem; font-weight:800; color:#FE2C55; }
    .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; width:100%; max-width:360px; }
    .hole { aspect-ratio:1; background:#2a1a4e; border-radius:50%; position:relative; overflow:hidden; display:flex; align-items:flex-end; justify-content:center; border:3px solid #3a2a5e; cursor:pointer; }
    .hole::after { content:''; position:absolute; bottom:0; left:0; right:0; height:35%; background:#1a0a2e; border-radius:0 0 50% 50%; z-index:2; }
    .mole { width:85%; aspect-ratio:1; border-radius:50%; position:absolute; bottom:-100%; transition:bottom 0.18s cubic-bezier(.34,1.56,.64,1); z-index:1; object-fit:cover; border:3px solid #FE2C55; }
    .mole.up { bottom:5%; }
    .mole.hit { filter:brightness(3) saturate(0); transform:scale(1.2); transition:all 0.1s; }
    .stars { position:absolute; top:-10px; left:50%; transform:translateX(-50%); font-size:1.6rem; opacity:0; z-index:10; pointer-events:none; transition:opacity 0.1s; }
    .stars.show { animation:flyup 0.6s forwards; }
    @keyframes flyup { 0%{opacity:1;top:-10px} 100%{opacity:0;top:-60px} }
    .btn { margin-top:20px; background:#FE2C55; color:#fff; border:none; border-radius:14px; padding:14px 40px; font-size:1.1rem; font-weight:700; cursor:pointer; }
    .btn:active { transform:scale(0.95); }
    #overlay { position:fixed; inset:0; background:rgba(0,0,0,0.85); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; z-index:99; }
    #overlay h2 { font-size:2rem; }
    #overlay .score-big { font-size:4rem; font-weight:900; color:#FE2C55; }
    .loading { color:#888; font-size:0.9rem; margin-top:8px; }
  </style>
</head>
<body>

<h1>😂 اصطاد أصحابك</h1>
<p class="sub">اضغط على وجههم قبل ما يختفون</p>

<div class="hud">
  <div class="hud-box"><div class="label">النقاط</div><div class="val" id="score">0</div></div>
  <div class="hud-box"><div class="label">الوقت</div><div class="val" id="timer">30</div></div>
  <div class="hud-box"><div class="label">أعلى</div><div class="val" id="best">0</div></div>
</div>

<div class="grid" id="grid">
  <!-- 6 holes -->
</div>

<button class="btn" id="startBtn" onclick="startGame()">ابدأ 🎯</button>
<p class="loading" id="loadMsg">جاري تحميل وجوههم...</p>

<div id="overlay" style="display:none">
  <h2>انتهت اللعبة 💀</h2>
  <div class="score-big" id="finalScore">0</div>
  <p>نقطة</p>
  <button class="btn" onclick="startGame()">مرة ثانية 🔁</button>
</div>

<script>
const BOT_TOKEN = '8887053938:AAFf89tf-3ki0OEzLSZSk7uWaN72cGf4lck';
const HOLES = 6;
let photos = [];
let score = 0, best = 0, timeLeft = 30;
let gameActive = false;
let moleTimers = [];
let gameTimer = null;

// بناء الشبكة
const grid = document.getElementById('grid');
for (let i = 0; i < HOLES; i++) {
  const hole = document.createElement('div');
  hole.className = 'hole';
  hole.id = 'hole' + i;
  const img = document.createElement('img');
  img.className = 'mole';
  img.id = 'mole' + i;
  img.src = '';
  const stars = document.createElement('div');
  stars.className = 'stars';
  stars.id = 'stars' + i;
  stars.textContent = '💥';
  hole.appendChild(img);
  hole.appendChild(stars);
  hole.onclick = () => whack(i);
  grid.appendChild(hole);
}

// جلب صور الأصحاب من التيليغرام
async function loadPhotos() {
  try {
    const r = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUpdates?limit=100`);
    const d = await r.json();
    const fileIds = [];
    for (const u of d.result) {
      if (u.message?.photo) {
        const biggest = u.message.photo[u.message.photo.length - 1];
        if (!fileIds.includes(biggest.file_id)) fileIds.push(biggest.file_id);
      }
    }
    for (const fid of fileIds.slice(0,6)) {
      const fr = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getFile?file_id=${fid}`);
      const fd = await fr.json();
      photos.push(`https://api.telegram.org/file/bot${BOT_TOKEN}/${fd.result.file_path}`);
    }
    if (photos.length === 0) photos = ['https://i.pravatar.cc/150?img=1','https://i.pravatar.cc/150?img=2','https://i.pravatar.cc/150?img=3'];
    document.getElementById('loadMsg').textContent = `✅ حُمّل ${photos.length} وجوه — جاهز!`;
  } catch(e) {
    photos = ['https://i.pravatar.cc/150?img=1','https://i.pravatar.cc/150?img=2','https://i.pravatar.cc/150?img=3'];
    document.getElementById('loadMsg').textContent = '⚠️ ما قدر يحمل الصور — يستخدم placeholder';
  }
}

function getPhoto(i) {
  return photos.length ? photos[i % photos.length] : 'https://i.pravatar.cc/150';
}

function showMole(holeIdx) {
  if (!gameActive) return;
  const mole = document.getElementById('mole' + holeIdx);
  mole.src = getPhoto(Math.floor(Math.random() * photos.length));
  mole.classList.add('up');
  mole.dataset.hit = '0';
  const delay = Math.max(600, 1400 - (30 - timeLeft) * 25);
  moleTimers[holeIdx] = setTimeout(() => {
    if (mole.dataset.hit === '0') hideMole(holeIdx);
  }, delay);
}

function hideMole(i) {
  const mole = document.getElementById('mole' + i);
  mole.classList.remove('up', 'hit');
  setTimeout(() => {
    if (gameActive) scheduleNext(i);
  }, 300);
}

function scheduleNext(i) {
  const delay = Math.random() * 1000 + 400;
  setTimeout(() => { if (gameActive) showMole(i); }, delay);
}

function whack(i) {
  if (!gameActive) return;
  const mole = document.getElementById('mole' + i);
  if (!mole.classList.contains('up') || mole.dataset.hit === '1') return;
  mole.dataset.hit = '1';
  mole.classList.add('hit');
  clearTimeout(moleTimers[i]);
  score++;
  document.getElementById('score').textContent = score;
  const stars = document.getElementById('stars' + i);
  stars.classList.remove('show');
  void stars.offsetWidth;
  stars.classList.add('show');
  setTimeout(() => hideMole(i), 200);
}

function startGame() {
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('startBtn').style.display = 'none';
  score = 0; timeLeft = 30; gameActive = true;
  document.getElementById('score').textContent = 0;
  document.getElementById('timer').textContent = 30;
  for (let i = 0; i < HOLES; i++) scheduleNext(i);
  gameTimer = setInterval(() => {
    timeLeft--;
    document.getElementById('timer').textContent = timeLeft;
    if (timeLeft <= 0) endGame();
  }, 1000);
}

function endGame() {
  gameActive = false;
  clearInterval(gameTimer);
  moleTimers.forEach(clearTimeout);
  for (let i = 0; i < HOLES; i++) {
    const mole = document.getElementById('mole' + i);
    mole.classList.remove('up','hit');
  }
  if (score > best) { best = score; document.getElementById('best').textContent = best; }
  document.getElementById('finalScore').textContent = score;
  document.getElementById('overlay').style.display = 'flex';
  document.getElementById('startBtn').style.display = 'block';
}

loadPhotos();
</script>
</body>
</html>
